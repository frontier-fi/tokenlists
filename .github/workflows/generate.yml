name: Generate tokenlists

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      # A pull request opened with GITHUB_TOKEN starts no workflows, so checks would never
      # run. One opened by the maxyz-actions app does.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23lin88uMBRaCQ5SzJ
          private-key: ${{ secrets.MAXYZ_ACTIONS_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Dependencies
        run: npm ci
      - name: Generate Tokenlists
        run: npm run generate
        env:
          DRPC_API_KEY: ${{ secrets.DRPC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: 'chore: Update generated tokenlists'
          committer: GitHub <noreply@github.com>
          author:
            ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          signoff: false
          branch: update-tokenlists
          delete-branch: true
          title: 'Update generated tokenlists'
          body: |
            This PR was autogenerated because of changes to tokenlists.
          draft: false
      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge --auto --merge "${{ steps.create-pr.outputs.pull-request-number }}"

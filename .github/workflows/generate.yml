name: Generate tokenlists

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Dependencies
        run: npm ci
      - name: Generate Tokenlists
        run: npm run generate
        env:
          SEPOLIA_RPC_ENDPOINT: ${{ secrets.SEPOLIA_RPC_ENDPOINT }}
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          DRPC_KEY: ${{ secrets.DRPC_KEY }}
      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: 'chore: Update generated tokenlists'
          committer: GitHub <noreply@github.com>
          author:
            ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          signoff: false
          branch: update-tokenlists
          delete-branch: true
          title: 'Update generated tokenlists'
          body: |
            This PR was autogenerated because of changes to tokenlists.
          draft: false
      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge --auto --merge "${{ steps.create-pr.outputs.pull-request-number }}"

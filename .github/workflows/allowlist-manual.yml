name: Allowlist Token Manually

on:
  workflow_dispatch:
    inputs:
      network:
        type: choice
        description: Network
        required: true
        options:
          - arbitrum
          - avalanche
          - mainnet
          - gnosis-chain
          - polygon
          - optimism
          - zkevm
      tokenAddress:
        type: string
        description: Token Address
        required: true
      tokenSymbol:
        type: string
        description: Token Symbol
        required: false

jobs:
  allowlist-token:
    permissions:
      contents: read
    uses: ./.github/workflows/allowlist.yml
    secrets: inherit
    with:
      network: ${{ github.event.inputs.network }}
      tokenAddress: ${{ github.event.inputs.tokenAddress }}
      tokenSymbol: ${{ github.event.inputs.tokenSymbol }}

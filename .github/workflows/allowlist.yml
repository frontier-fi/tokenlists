name: Allowlist Token

on:
  workflow_call:
    inputs:
      network:
        type: string
        required: true
      tokenAddress:
        type: string
        required: true
      tokenSymbol:
        type: string
        required: false

permissions:
  contents: read

jobs:
  allowlist-token:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install deps
        run: npm install cac
      - name: Run allowlist script
        run: npx tsx ./src/lib/scripts/allowlist-token.ts --network ${{inputs.network}} --tokenAddress \"${{inputs.tokenAddress}}\" --tokenSymbol "${{inputs.tokenSymbol}}"
      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: 'chore: Add ${{ inputs.tokenSymbol }} to ${{ inputs.network }} allowlist'
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          signoff: false
          branch: update-allowlist-${{inputs.network}}-${{inputs.tokenAddress}}
          base: main
          delete-branch: true
          title: 'Allowlist ${{inputs.tokenSymbol}} on ${{inputs.network}}'
          body: |
            This PR was autogenerated by the allowlist Github action.
          draft: false
          labels: allowlist
      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge --auto --merge "${{ steps.create-pr.outputs.pull-request-number }}"

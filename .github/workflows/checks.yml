name: Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Show runner setup
        run: |
          echo "node=$(node -v)"
          echo "npm=$(npm -v)"
      - name: Install deps
        run: npm ci
      - name: Run lint
        run: npm run lint

name: Smoke runner setup

# Lightweight checkout + Node 24 + npm ci smoke test (no secrets, no PR).
# Run from a branch: gh workflow run smoke-runner.yml --ref <branch>
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Show runner setup
        run: |
          echo "node=$(node -v)"
          echo "npm=$(npm -v)"
          node -e "console.log('ok', process.version)"
      - name: Install Dependencies
        run: npm ci
      - name: Typecheck toolchain
        run: npx tsc --version && npx ts-node --version
